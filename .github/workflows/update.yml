name: 스크리너 갱신

# 시황에 맞춰 자동 갱신하고, 비공개 URL(Cloudflare Pages + Access)로 배포한다.
#  - 평일 미국장 마감 후 하루 한 번 (21:30 UTC)
#  - Actions 탭에서 수동 실행 가능
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    # 로직·설정·테스트·워크플로 자체가 바뀌면 돈다.
    # reports/ 는 이 워크플로가 스스로 커밋하는 곳이라 넣으면 무한 루프가 된다.
    paths:
      - "themes.yaml"
      - "screener/**"
      - "run.py"
      - "discover_customers.py"
      - "diagnose_output.py"
      - "export_financials.py"
      - "tests/**"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: write        # 고객군 리포트를 저장소로 되돌려 커밋하기 위함

# 연속 푸시로 앞선 실행이 취소되면 무엇이 돌았는지 알 수 없다.
# 큐에 쌓아 순서대로 돌린다.
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 로컬 전체 실행이 5초다. 차단된 호스트에 타임아웃을 먹으면 몇 시간까지
    # 늘어지므로(실제로 그랬다) 상한을 둔다. 넘으면 죽는 게 낫다.
    timeout-minutes: 12
    # secrets 컨텍스트는 step 의 if 에서 쓸 수 없다(Unrecognized named-value).
    # 잡 레벨 env 로 한 번 받아야 step if 에서 참조할 수 있다.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_PW: ${{ secrets.SCREENER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 판별 로직 회귀를 여기서 막는다. 오늘 겪은 사고들이 전부 케이스로 있다.
      # 네트워크를 쓰지 않으므로 러너 환경과 무관하게 돈다.
      - name: 회귀 테스트
        run: python tests/run_tests.py

      # 이전 실행 캐시를 재사용해 SEC 호출을 줄인다 (SEC 는 10 req/s 제한)
      - name: 데이터 캐시 복원
        uses: actions/cache@v4
        with:
          path: cache
          key: screener-data-${{ github.run_id }}
          restore-keys: screener-data-

      # BEA 키는 시크릿에만 있어 로컬에서 검증할 수 없다. 그래서 결과를 리포트로
      # 남기고 저장소에 되돌려 커밋한다 — 그게 다음 수정의 유일한 근거가 된다.
      - name: 고객군 자동 지정 (BEA 산업연관표)
        continue-on-error: true
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          SCREENER_UA: ${{ secrets.SCREENER_UA }}
        run: python discover_customers.py
        id: bea

      # 실행 기록은 항상 남긴다. 이게 없으면 '실행이 안 됐다'와 '결과가 같아
      # 커밋이 생략됐다'를 구별할 수 없어, 원인을 엉뚱한 데서 찾게 된다.
      - name: 실행 기록·리포트 커밋
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          if [ -f out/customers_report.md ]; then
            cp out/customers_report.md reports/customers_report.md
          fi
          {
            echo "# 실행 기록"
            echo
            echo "- 실행 시각: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 커밋: ${GITHUB_SHA:0:8}"
            echo "- 실행 번호: ${GITHUB_RUN_NUMBER} (run id ${GITHUB_RUN_ID})"
            echo "- BEA 단계: ${{ steps.bea.outcome }}"
          } > reports/run_status.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "실행 기록 갱신 (run ${GITHUB_RUN_NUMBER})"
          # 사람이 동시에 푸시했을 수 있으므로 리베이스 후 재시도
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 5
          done
          echo "푸시 실패 — 기록은 아티팩트로만 남습니다"

      - name: 실행 기록 아티팩트
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-status
          path: reports/
          retention-days: 30

      - name: 스크리너 실행
        timeout-minutes: 8
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_API: ${{ secrets.EIA_API }}
          # 시크릿 이름은 사람이 붙인다. keys.py 가 _KEY 접미사 유무를 함께 보므로
          # 아래 두 이름 중 실제로 등록된 쪽이 잡힌다.
          CENSUS_API: ${{ secrets.CENSUS_API }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          DATA_GOV_API: ${{ secrets.DATA_GOV_API }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          # SEC 는 연락처가 담긴 User-Agent 를 요구한다. 없으면 403.
          SCREENER_UA: ${{ secrets.SCREENER_UA }}
        run: python run.py --no-open

      - name: 결과 확인
        run: |
          test -s out/screener.html || { echo "대시보드가 생성되지 않았습니다"; exit 1; }
          echo "생성됨: $(wc -c < out/screener.html) bytes"

      # Cloudflare 가 안 되는 경우에도 결과를 받을 수 있는 백업 경로
      - uses: actions/upload-artifact@v4
        with:
          name: screener-html
          path: out/screener.html
          retention-days: 30

      # 비공개 배포. Cloudflare Access 가 앞단에서 이메일 인증을 요구하므로
      # URL 을 알아도 등록된 계정이 아니면 열 수 없다.
      # Cloudflare 가 대시보드에서 Pages 생성 메뉴를 없앴다(Workers 로 통합 중).
      # CLI 로 만든다. 이미 있으면 실패하는데 그건 정상이므로 무시한다.
      - name: Cloudflare Pages 프로젝트 준비
        id: cfproj
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create us-market-screener --production-branch=main

      # 비밀번호를 Pages 환경변수로 올린다. 코드나 저장소에는 남지 않는다.
      # 이게 있어야 _worker.js 가 인증을 요구한다 — 없으면 사이트는 공개다.
      - name: 비밀번호 등록
        id: cfsecret
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.SITE_PW != ''
        continue-on-error: true
        env:
          SITE_PW: ${{ secrets.SCREENER_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$SITE_PW" | npx --yes wrangler@3 pages secret put \
            SCREENER_PASSWORD --project-name=us-market-screener

      - name: Cloudflare Pages 배포
        id: cfdeploy
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=us-market-screener --branch=main

      # 배포 결과도 기록한다. BEA 때와 같은 실수를 반복하지 않기 위함 —
      # 결과를 안 남기면 실패했는지 안 돌았는지 구별할 수 없다.
      - name: 배포 결과 기록
        if: always()
        continue-on-error: true
        run: |
          {
            echo
            echo "## 배포"
            echo
            if [ -z "$CF_TOKEN" ]; then
              echo "- Cloudflare 시크릿 미설정 — 배포 생략."
              echo "  결과는 아티팩트 \`screener-html\` 로 받으세요."
            else
              echo "- 시크릿: 설정됨"
              echo "- 프로젝트 준비: ${{ steps.cfproj.outcome }} (이미 있으면 failure 가 정상)"
              echo "- 배포: ${{ steps.cfdeploy.outcome }}"
              # 공개 여부는 사용자 선택 사항 — 경고하지 않는다.
              # (잠그고 싶어지면 SCREENER_PASSWORD 시크릿만 추가하면 된다)
              if [ -n "$SITE_PW" ]; then
                echo "- 잠금: 활성 (아이디 screener)"
              fi
              echo "- 주소: https://us-market-screener.pages.dev"
              python diagnose_output.py || echo "- 진단 스크립트 실패"
            fi
          } >> reports/run_status.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/run_status.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "배포 결과 기록 (run ${GITHUB_RUN_NUMBER})"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep 5
          done
