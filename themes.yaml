# =============================================================================
#  테마 / 밸류체인 정의
# =============================================================================
#  판별식은 설계_촉매판별.md 참조. 각 축은 주장·확증·기각 3요소로 판정하며,
#  기각에 걸린 축은 점수 0이 아니라 '기각 + 사유'로 화면에 남는다.
#
#  tickers      이 테마로 돈 버는 회사
#  customers    이들의 고객. ①낙수·④교체주기는 여기서 측정한다 —
#               전력기기가 오르는 이유는 전력기기 산업생산이 아니라
#               유틸리티/데이터센터의 설비가 늙고 증설이 밀려서다.
#                 tickers: 고객 상장사 (④ 설비 소진율·억압된 교체)
#                 series:  고객 산업의 실질 활동 지표 (① 전이 실증)
#               ※ discover_customers.py 로 자동 채울 수 있고, 아래 값은 수정 가능
#
#  fred:  (이름은 fred 지만 소스는 접두사로 고른다)
#    접두사 없으면 FRED,  "eia:PET.WPULEUS3.W" 처럼 쓰면 EIA.
#    EIA 는 무료 키 필요(EIA_API_KEY 또는 eia_key.txt). 없으면 해당 축만 nodata.
#    industrial_production  전방수요 Q            ②확증
#    capacity_utilization   가동률                ②주장
#    capacity_index         생산능력 지수(CAPG*)  ②기각·⑥확증  ← 사양산업 판별의 핵심
#    ppi_output/ppi_input   판가/원가             ⑦
#    inventories/shipments  재고·출하 (비율은 계산) ⑧
#    new_orders             신규수주              ⑧⑨확증
#    unfilled_orders        수주잔고              ⑨
#    trade_naics            NAICS 코드            ⑩ 수입침투율(Census 키 필요)
#
#  ⑧⑨는 산업별 M3 시리즈를 지정해야 켜진다. 전 제조업 총계로 폴백하면 모든
#  테마가 같은 점수를 받아 순위가 무의미해지므로, 미지정이면 축을 끈다.
#    A31* 1차금속  A32* 금속가공  A33* 기계  A34* 컴퓨터·전자
#    A35* 전기장비  A36* 운송장비  A24* 석유·석탄
#    끝 두 글자: TI 재고 / VS 출하 / NO 신규수주,  잔고는 U**SUO
#  비내구재(석유·화학 등)는 신규수주·수주잔고를 조사하지 않는다 → ⑨ 자동 비활성,
#  ⑧의 수요 확증은 출하로 대체된다.
#
#  fedreg_terms / fedreg_agencies
#    ⑤ 정책 축. 기관을 지정하지 않으면 광의어가 무관 규칙을 긁으므로 축이 기각된다.
#    기관 슬러그는 federalregister.gov/api/v1/agencies.json 에서 확인.
# =============================================================================

benchmark: SPY

themes:
  - name: 전력기기·그리드
    thesis: 데이터센터/전동화로 전력 수요는 뛰는데 변압기·개폐기 증설은 리드타임이 수년
    catalysts: [공급, 낙수]
    lead_time: 12~24M
    # 체인: 기기(GEV 터빈·그리드솔루션 / ETN·HUBB 배전 / POWL 개폐기)
    #      → 부자재(AZZ 도금 / ATKR 전선관 / NVT 인클로저)
    #      → 시공 EPC(PWR / MTZ 송전선 건설)
    # VRT 는 데이터센터 열관리 테마로 일원화(중복 제거)
    tickers: [GEV, ETN, HUBB, POWL, AZZ, NVT, ATKR, PWR, MTZ]
    customers:
      tickers: [NEE, DUK, SO, AEP, D, EXC, EQIX, DLR]
      series: IPUTIL
    edgar_keywords: ["grid modernization", "transformer lead time", "interconnection queue"]
    fedreg_terms: ["electric transmission", "interconnection"]
    fedreg_agencies: [federal-energy-regulatory-commission, energy-department]
    fred:
      industrial_production: IPG335S
      capacity_utilization: CAPUTLG335S
      capacity_index: CAPG335S
      ppi_output: PCU335311335311
      ppi_input: WPU102501
      inventories: A35STI
      shipments: A35SVS
      new_orders: A35SNO
      unfilled_orders: U35SUO
      trade_naics: "335"    # ⑩ 수입침투율 — 변압기 수입 의존이 국내 증설로 바뀌는지

  - name: 반도체 첨단패키징·후공정
    thesis: 미세화 한계로 가치가 전공정에서 후공정/패키징으로 이동
    catalysts: [신기술, 낙수]
    lead_time: 6~18M
    # 체인: OSAT 조립(AMKR) → 테스트(TER·COHU) → 계측·검사(ONTO·CAMT)
    #      → 본딩 장비(KLIC) → 프로브카드(FORM)
    # ACLS 제거 — 이온주입은 전공정 장비라 후공정 테마에 오분류였다
    tickers: [AMKR, TER, ONTO, CAMT, KLIC, COHU, FORM]
    customers:
      tickers: [NVDA, AMD, AVGO, QCOM, TXN, ADI, MU]
      series: IPG3344S
    edgar_keywords: ["advanced packaging", "hybrid bonding", "chiplet"]
    fedreg_terms: ["semiconductor manufacturing"]
    fedreg_agencies: [commerce-department]
    fred:
      industrial_production: IPG3344S
      capacity_utilization: CAPUTLG3344S
      capacity_index: CAPG3344S
      ppi_output: PCU3344133441
      ppi_input: WPU102501
      inventories: A34STI
      shipments: A34SVS
      new_orders: A34SNO
      unfilled_orders: U34SUO
      trade_naics: "334"    # ⑩ 수입침투율 — 후공정은 아시아 비중이 높다 — 국내 회귀 여부

  - name: 항공 애프터마켓·MRO
    thesis: 기재 노후화 + 신규 인도 지연으로 기존 기체를 더 오래 굴려야 함. 정비 수요는 산수
    catalysts: [교체, 병목]
    lead_time: 12~36M
    tickers: [HEI, TDG, HWM, RBC, DCO, AIR, CW]
    customers:
      tickers: [DAL, UAL, AAL, LUV, ALK, FDX]
      # 애프터마켓의 고객은 항공기 제조사가 아니라 항공사다. 기재를 굴린
      # 만큼 정비 수요가 난다 — BTS 여객마일(FRED 재배포)이 진짜 전방수요다.
      series: AIRRPMTSI
    edgar_keywords: ["aftermarket spare parts", "MRO capacity", "aircraft utilization"]
    fedreg_terms: ["airworthiness directive"]
    fedreg_agencies: [federal-aviation-administration]
    fred:
      industrial_production: IPG3364T9S
      capacity_utilization: CAPUTLG3364T9S
      capacity_index: CAPG3364T9S
      ppi_output: PCU3364133641
      ppi_input: WPU1017
      inventories: ANAPTI
      shipments: ANAPVS
      new_orders: ANAPNO
      unfilled_orders: UNAPUO

  - name: 데이터센터 열관리
    thesis: 랙 전력밀도 상승으로 공랭이 한계에 도달 → 액침·직접칩냉각으로 기술 전환
    catalysts: [신기술, 낙수]
    lead_time: 6~18M
    # 체인: 냉각 장비(VRT 전력·열관리 / MOD 액침·칠러 / AAON 공조)
    #      → 부품(SPXC) → 대형 공조(TT) → 기계설비 시공(FIX)
    # CARR 제거 — 주택용 비중이 커서 DC 순도가 낮다
    tickers: [VRT, MOD, SPXC, AAON, TT, FIX]
    customers:
      tickers: [MSFT, AMZN, GOOGL, META, EQIX, DLR]
      series: IPG3341S
    edgar_keywords: ["liquid cooling", "direct-to-chip cooling", "immersion cooling"]
    fedreg_terms: ["data center energy efficiency"]
    fedreg_agencies: [energy-department]
    fred:
      industrial_production: IPG333S
      capacity_utilization: CAPUTLG333S
      capacity_index: CAPG333S
      inventories: A33STI
      shipments: A33SVS
      new_orders: A33SNO
      unfilled_orders: U33SUO

  - name: 정유·정제마진
    thesis: 정제설비 순증설이 수년째 마이너스인데 수요는 유지 — 전형적 공급 비탄력
    catalysts: [공급, 스프레드]
    lead_time: 3~9M
    tickers: [VLO, MPC, PSX, DINO, PBF, DK]
    customers:
      tickers: [DAL, UAL, UPS, FDX, ODFL, JBHT]
      series: IPG324S
    edgar_keywords: ["refinery utilization", "crack spread"]
    fedreg_terms: ["renewable fuel standard", "refinery emissions"]
    fedreg_agencies: [environmental-protection-agency]
    fred:
      # 정유는 주 단위로 움직인다. 월간 산업생산으로는 못 본다.
      # EIA 주간 데이터는 FRED 에 재배포되지 않아 직접 받는다(무료 키 필요).
      # 키가 없으면 해당 축은 사유와 함께 nodata 가 된다 — 조용히 죽지 않는다.
      capacity_utilization: "eia:PET.WPULEUS3.W"    # 정제설비 가동률(주간)
      capacity_index: CAPG324S                       # 정제능력(월간, FRED)
      industrial_production: IPG324S
      ppi_output: WPU057303
      ppi_input: WPU0561
      inventories: "eia:PET.WGTSTUS1.W"              # 휘발유 재고(주간)
      shipments: "eia:PET.WGFUPUS2.W"                # 휘발유 공급량(주간)

  - name: 원자력 연료주기
    thesis: 각국 원전 회귀 + 러시아산 농축우라늄 배제로 서방 농축·변환 능력이 병목
    # 병목 축(⑨)은 농축 산업의 수주잔고 시리즈가 없어 측정 불가였다 —
    # 선언만 하고 못 재면 만성 '일부확인불가'가 된다(F46). 유틸리티 고객
    # 수요 전이(낙수)로 교체: 같은 논지를 측정 가능한 쪽에서 본다.
    catalysts: [정책, 낙수]
    lead_time: 12~36M
    # 체인: 채굴(CCJ 세계 2위 / UEC·DNN·NXE 미주 개발)
    #      → 변환·농축(LEU — 미국 유일 NRC 승인 HALEU, 2026-01 DOE 9억$ 수주)
    #      → 부품·군용로(BWXT)
    # SMR 개발사(OKLO·SMR·NNE)는 매출 전 단계라 재무 집계를 오염시켜 제외
    tickers: [CCJ, LEU, UEC, DNN, NXE, BWXT]
    customers:
      tickers: [CEG, VST, NEE, DUK, SO, EXC]
      series: IPUTIL
    edgar_keywords: ["small modular reactor", "enriched uranium", "HALEU"]
    fedreg_terms: ["nuclear reactor", "uranium enrichment"]
    fedreg_agencies: [nuclear-regulatory-commission, energy-department]
    fred:
      industrial_production: IPUTIL

  - name: 철강·특수강
    thesis: 관세·리쇼어링 수요 대비 국내 증설 제한. 캐펙스 사이클 바닥 여부가 관건
    catalysts: [캐펙스, 정책]
    lead_time: 6~18M
    # 체인: 전기로(NUE·STLD·CMC) → 고로(CLF) → 특수강·합금(CRS·ATI)
    #      → 유통(RS)
    # X 제거 — 2025 Nippon Steel 피인수로 상폐(CIK 조회로 확인)
    tickers: [NUE, STLD, CMC, CLF, CRS, ATI, RS]
    customers:
      tickers: [CAT, DE, PCAR, GM, F, WHR]
      series: IPG332S
    edgar_keywords: ["reshoring", "domestic steel capacity"]
    fedreg_terms: ["steel imports", "section 232"]
    fedreg_agencies: [commerce-department, international-trade-administration]
    fred:
      industrial_production: IPG3311A2S      # 철강 세부(331 전체는 알루미늄·구리 포함)
      capacity_utilization: CAPUTLG3311A2S
      capacity_index: CAPG3311A2S
      ppi_output: WPU1017
      ppi_input: WPU101
      inventories: A31STI
      shipments: A31SVS
      new_orders: A31SNO
      unfilled_orders: U31SUO
      trade_naics: "331"    # ⑩ 수입침투율 — 관세·리쇼어링이 실제로 수입을 밀어냈는지

  - name: 방산·탄약
    thesis: 재고 소진분 보충 + 각국 GDP 대비 국방비 상향. 예산은 이미 확정된 다년 계약
    # 논지 첫 구절이 '재고 소진분 보충'인데 재고 축이 선언에 빠져 있었다(선언 실수).
    # 병목은 남긴다 — 수주잔고/출하가 10년 최저라는 '반박 증거'가 계속 보여야 한다.
    catalysts: [정책, 재고, 병목]
    lead_time: 12~36M
    tickers: [LMT, NOC, GD, LHX, HII, LDOS]
    customers: {}          # 주요 고객이 정부라 상장 고객군이 없다 — ①④축은 자동 비활성
    edgar_keywords: ["munitions production", "defense backlog"]
    # 방산 수요는 규제가 아니라 예산이 만든다. Federal Register 검색은
    # 애초에 맞지 않는 도구였다 — 실제 연방 계약 의무액을 본다(키 불필요).
    usaspending:
      agency: Department of Defense
      naics: ["3364", "3329"]      # 항공우주 + 탄약·무기
    fedreg_terms: ["defense procurement", "munitions"]
    fedreg_agencies: [defense-department]
    fred:
      industrial_production: IPG3364T9S
      capacity_utilization: CAPUTLG3364T9S
      capacity_index: CAPG3364T9S
      inventories: ADEFTI
      shipments: ADEFVS
      new_orders: ADEFNO
      unfilled_orders: UDEFUO

