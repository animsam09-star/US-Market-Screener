  - name: 정유·정제마진
    thesis: 정제설비 순증설이 수년째 마이너스인데 수요는 유지 — 전형적 공급 비탄력
    catalysts: [공급, 스프레드]
    lead_time: 3~9M
    tickers: [VLO, MPC, PSX, DINO, PBF, DK]
    customers:
      tickers: [DAL, UAL, UPS, FDX, ODFL, JBHT]
      series: IPG324S
    edgar_keywords: ["refinery utilization", "crack spread"]
    fedreg_terms: ["renewable fuel standard", "refinery emissions"]
    fedreg_agencies: [environmental-protection-agency]
    fred:
      # 정유는 주 단위로 움직인다. 월간 산업생산으로는 못 본다.
      # EIA 주간 데이터는 FRED 에 재배포되지 않아 직접 받는다(무료 키 필요).
      # 키가 없으면 해당 축은 사유와 함께 nodata 가 된다 — 조용히 죽지 않는다.
      capacity_utilization: "eia:PET.WPULEUS3.W"    # 정제설비 가동률(주간)
      capacity_index: CAPG324S                       # 정제능력(월간, FRED)
      industrial_production: IPG324S
      ppi_output: WPU057303
      ppi_input: WPU0561
      inventories: "eia:PET.WGTSTUS1.W"              # 휘발유 재고(주간)
      shipments: "eia:PET.WGFUPUS2.W"                # 휘발유 공급량(주간)

