# =============================================================================
#  테마 / 밸류체인 정의
# =============================================================================
#  판별식은 설계_촉매판별.md 참조. 각 축은 주장·확증·기각 3요소로 판정하며,
#  기각에 걸린 축은 점수 0이 아니라 '기각 + 사유'로 화면에 남는다.
#
#  tickers      이 테마로 돈 버는 회사
#  customers    이들의 고객. ①낙수·④교체주기는 여기서 측정한다 —
#               전력기기가 오르는 이유는 전력기기 산업생산이 아니라
#               유틸리티/데이터센터의 설비가 늙고 증설이 밀려서다.
#                 tickers: 고객 상장사 (④ 설비 소진율·억압된 교체)
#                 series:  고객 산업의 실질 활동 지표 (① 전이 실증)
#               ※ discover_customers.py 로 자동 채울 수 있고, 아래 값은 수정 가능
#
#  fred:  (이름은 fred 지만 소스는 접두사로 고른다)
#    접두사 없으면 FRED,  "eia:PET.WPULEUS3.W" 처럼 쓰면 EIA.
#    EIA 는 무료 키 필요(EIA_API_KEY 또는 eia_key.txt). 없으면 해당 축만 nodata.
#    industrial_production  전방수요 Q            ②확증
#    capacity_utilization   가동률                ②주장
#    capacity_index         생산능력 지수(CAPG*)  ②기각·⑥확증  ← 사양산업 판별의 핵심
#    ppi_output/ppi_input   판가/원가             ⑦
#    inventories/shipments  재고·출하 (비율은 계산) ⑧
#    new_orders             신규수주              ⑧⑨확증
#    unfilled_orders        수주잔고              ⑨
#    trade_naics            NAICS 코드            ⑩ 수입침투율(Census 키 필요)
#
#  ⑧⑨는 산업별 M3 시리즈를 지정해야 켜진다. 전 제조업 총계로 폴백하면 모든
#  테마가 같은 점수를 받아 순위가 무의미해지므로, 미지정이면 축을 끈다.
#    A31* 1차금속  A32* 금속가공  A33* 기계  A34* 컴퓨터·전자
#    A35* 전기장비  A36* 운송장비  A24* 석유·석탄
#    끝 두 글자: TI 재고 / VS 출하 / NO 신규수주,  잔고는 U**SUO
#  비내구재(석유·화학 등)는 신규수주·수주잔고를 조사하지 않는다 → ⑨ 자동 비활성,
#  ⑧의 수요 확증은 출하로 대체된다.
#
#  fedreg_terms / fedreg_agencies
#    ⑤ 정책 축. 기관을 지정하지 않으면 광의어가 무관 규칙을 긁으므로 축이 기각된다.
#    기관 슬러그는 federalregister.gov/api/v1/agencies.json 에서 확인.
# =============================================================================

